<svg xmlns="http://www.w3.org/2000/svg" width="900" height="558" viewBox="0 0 900 558" role="img" aria-label="Silpa R, Python Full Stack Developer: GitHub profile card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
